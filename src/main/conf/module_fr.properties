ModuleDescription=Le module TOSCA Designer est un composant au sein des cadres d'orchestration basés sur TOSCA qui facilite la création, l'édition et la visualisation de modèles d'applications et de services conformes à TOSCA. Ce module fournit généralement une interface utilisateur graphique (GUI) ou un environnement de développement intégré (IDE) permettant aux utilisateurs de concevoir, modéliser et manipuler visuellement des modèles TOSCA, y compris les modèles de topologie, les types de nœuds, les types de relations, les politiques et les plans.
ModuleLabel=TOSCA Designer

